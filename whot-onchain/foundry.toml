[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 200
# _play carries more locals since the bot started sharing the rules; the IR
# pipeline handles the stack depth the legacy codegen cannot.
via_ir = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "", url = "https://sourcify-api-monad.blockvision.org", chain = 10143 }
